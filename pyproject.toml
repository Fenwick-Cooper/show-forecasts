[tool.poetry]
name = "show-forecasts"
version = "0.1.4"
description = "cGAN forecasts post-processing and visualization scripts"
authors = [
    "Fenwick <fenwick.cooper@physics.ox.ac.uk>",
    "Jason <Jason.Kinyua@igad.int>",
]
license = "CC BY 4.0"
readme = "README.md"
packages = [{ include = "show_forecasts", from = "./" }]
include = [{ path = "show_forecasts/data", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = "^2.1.3"
pandas = "^2.2.3"
Cartopy = "^0.24.1"
matplotlib = "^3.9.2"
cfgrib = "^0.9.10.4"
xarray = { extras = ["io", "viz"], version = "^2024.11.0" }
eccodes = "2.38.3"
netcdf4 = "^1.7.2"
pyshp = "^2.3.1"
ipykernel = "^6.29.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
